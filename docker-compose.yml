name: voicevox_tts_discord_bot

services:
  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    container_name: voicevox-engine
    restart: unless-stopped
    ports:
      - "50021:50021"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: "${BOT_IMAGE:-voicevox_tts_discord_bot-bot:latest}"
    build:
      context: .
    container_name: voicevox-tts-discord-bot
    restart: unless-stopped
    init: true
    env_file:
      - "${VOICEBOT_ENV_FILE:-.env}"
    environment:
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo
      BOT_LOG_FILE: /app/data/logs/voicebot.log
      BOT_LOG_MAX_BYTES: "10485760"
      BOT_LOG_BACKUP_COUNT: "5"
      BOT_STATUS_PATH: /run/bot-status/status.json
    depends_on:
      - voicevox
    volumes:
      - voicebot-data:/app/data
      - ${BOT_STATUS_HOST_DIR:-/home/natuki/services/runtime-status/voicevox-tts}:/run/bot-status
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  voicebot-data:
    name: voicevox-tts-discord-bot-data
    external: true
